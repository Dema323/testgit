name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEY: ${{ secrets.EMBER_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screen renders
        run: ./gradlew testDebugUnitTest recordRoborazziDebug --console=plain

      - name: Upload screen renders
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-screens
          path: android/app/build/screens/*.png

      - name: Signing key from secrets
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.EMBER_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ember.jks"

      - name: Build release APK
        env:
          EMBER_KEYSTORE: ${{ env.HAS_KEY == 'true' && format('{0}/ember.jks', runner.temp) || '' }}
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk Ember.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Ember-apk
          path: android/Ember.apk

      - name: Publish to the latest-build release
        # Only with the real signing key: an APK signed with another key can't update an installed copy.
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --latest \
            --title "Ember (latest build)" \
            --notes "**Windows:** download **Ember.exe** and double-click it (Windows 10/11, 64-bit). **Android:** download **Ember.apk** on your phone and open it (Android 8.0+)."
          gh release upload latest-build Ember.apk --clobber
