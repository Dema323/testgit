name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Fetch libmpv (shinchiro/mpv-winbuild-cmake, x86_64 build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -r -y
          ls -la libmpv-2.dll

      - name: Build single-file exe
        run: pyinstaller ember.spec --noconfirm

      - name: Launch test (the exe starts and stays up)
        shell: pwsh
        run: |
          Get-Item dist\Ember.exe | Select-Object Name, Length
          $p = Start-Process dist\Ember.exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { Write-Error "Ember.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:APPDATA "Ember\error.log"
          if (Test-Path $log) { Get-Content $log; Write-Error "error.log was written"; exit 1 }
          "Ember.exe started and kept running."

      - name: Playback test (real Windows video output, mock Plex server)
        shell: bash
        run: |
          export PATH="$(pwd):$PATH"   # libmpv-2.dll
          python tests/run_ui_test.py ui-test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test
          path: |
            ui-test/*.png
            ui-test/results.json

      - uses: actions/upload-artifact@v5
        with:
          name: Ember-exe
          path: dist/Ember.exe

      - name: Publish download (latest build)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release holds both apps; each workflow replaces only its own file.
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --latest \
            --title "Ember (latest build)" \
            --notes "**Windows:** download **Ember.exe** and double-click it (Windows 10/11, 64-bit). **Android:** download **Ember.apk** on your phone and open it (Android 8.0+)."
          gh release upload latest-build dist/Ember.exe --clobber

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Ember.exe --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/Ember.exe --clobber
