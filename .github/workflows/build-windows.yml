name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Fetch libmpv (shinchiro/mpv-winbuild-cmake, x86_64 build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -r -y
          ls -la libmpv-2.dll

      - name: Build single-file exe
        run: pyinstaller marquee.spec --noconfirm

      - name: Launch test (the exe starts and stays up)
        shell: pwsh
        run: |
          Get-Item dist\Marquee.exe | Select-Object Name, Length
          $p = Start-Process dist\Marquee.exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { Write-Error "Marquee.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:APPDATA "Marquee\error.log"
          if (Test-Path $log) { Get-Content $log; Write-Error "error.log was written"; exit 1 }
          "Marquee.exe started and kept running."

      - name: Playback test (real Windows video output, mock Plex server)
        shell: bash
        run: |
          export PATH="$(pwd):$PATH"   # libmpv-2.dll
          python tests/run_ui_test.py ui-test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test
          path: |
            ui-test/*.png
            ui-test/results.json

      - uses: actions/upload-artifact@v5
        with:
          name: Marquee-exe
          path: dist/Marquee.exe

      - name: Publish download (latest build)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/Marquee.exe --target "$GITHUB_SHA" --latest \
            --title "Marquee (latest build)" \
            --notes "Download **Marquee.exe** below and double-click it. Windows 10/11, 64-bit. Built from ${GITHUB_SHA::7}."

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Marquee.exe --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/Marquee.exe --clobber
