name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Fetch libmpv (shinchiro/mpv-winbuild-cmake, x86_64 build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -r -y
          ls -la libmpv-2.dll

      - name: Build
        run: pyinstaller marquee.spec --noconfirm

      - name: Smoke test (imports, libmpv loads)
        shell: bash
        run: |
          python -c "import os,sys; os.environ['PATH']=os.getcwd()+os.pathsep+os.environ['PATH']; import mpv; print('libmpv OK')"
          test -f dist/Marquee/Marquee.exe
          test -f dist/Marquee/_internal/libmpv-2.dll

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Marquee/* -DestinationPath Marquee-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-windows-x64
          path: Marquee-windows-x64.zip

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Marquee-windows-x64.zip --generate-notes || gh release upload "${GITHUB_REF_NAME}" Marquee-windows-x64.zip --clobber
